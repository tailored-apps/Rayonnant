# Build linii net5 (gałęzie v5/develop i v5/master): Debug + Release na każdym PR i pushu.
#
# Linia net5 jest utrzymywana tylko do poprawek; główny rozwój (.NET 10) idzie na develop/master.
# Projekty celują w net5.0-windows (EOL); SDK 10 nadal je buduje (ostrzeżenie NETSDK1138).
#
# Tylko build, bez publikacji na nuget.org. Publikację robi release.yml (Trusted Publishing)
# i tylko z develop (linia .NET 10, wersje 10.0.x). Linia 1.0.x jest zarezerwowana dla net5
# — publikację z v5/develop można dodać, kopiując release.yml z wersją 1.0.<run>.

name: .NET Core Desktop (v5 / net5)

on:
  push:
    branches: [ v5/develop, v5/master ]
  pull_request:
    branches: [ v5/develop, v5/master ]

permissions:
  contents: read

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: Rayonnant.sln
      Configuration: ${{ matrix.configuration }}
      BUILD_VERSION: 1.0.${{ github.run_number }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build
      run: dotnet build $env:Solution_Name --configuration $env:Configuration --no-restore -p:Version=$env:BUILD_VERSION
