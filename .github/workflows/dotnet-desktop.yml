# Build Rayonnant.sln (Debug + Release) na każdym PR i pushu do develop.
# Push do develop dodatkowo publikuje TailoredApps.Rayonnant.Interface na nuget.org.
#
# Wersja pakietów to 1.0.<numer przebiegu> nadawana przy buildzie (-p:Version),
# tak jak w pipeline'ach Jenkinsa. CI niczego nie commituje: develop jest
# zablokowany i chroniony PR-ami, więc commit "Version update" z CI nigdy nie przejdzie.

name: .NET Core Desktop

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: Rayonnant.sln
      Configuration: ${{ matrix.configuration }}
      BUILD_VERSION: 1.0.${{ github.run_number }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # Projekty celują w net5.0-windows (EOL); nowe SDK nadal je buduje (ostrzeżenie NETSDK1138).
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    # GeneratePackageOnBuild=true w projektach, więc build od razu tworzy .nupkg.
    - name: Build
      run: dotnet build $env:Solution_Name --configuration $env:Configuration --no-restore -p:Version=$env:BUILD_VERSION

    - name: Publish NuGet
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && matrix.configuration == 'Release'
      env:
        NUGET_KEY: ${{ secrets.RayonnantNugetKey }}
      run: >-
        dotnet nuget push "TailoredApps.Rayonnant.Interface/bin/Release/TailoredApps.Rayonnant.Interface.$env:BUILD_VERSION.nupkg"
        --api-key $env:NUGET_KEY
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate
