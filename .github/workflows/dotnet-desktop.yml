# Build Rayonnant.sln (Debug + Release) na każdym PR i pushu do develop. Tylko build:
# publikację na nuget.org robi release.yml (Trusted Publishing, bez klucza API w sekretach).
#
# Wersja w buildzie to 10.0.<numer przebiegu> (-p:Version) — linia .NET 10; linia 1.0.x
# zostaje dla net5 (gałęzie v5/develop i v5/master). CI niczego nie commituje: develop jest
# zablokowany i chroniony PR-ami, więc commit "Version update" z CI nigdy nie przejdzie.

name: .NET Core Desktop

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: Rayonnant.sln
      Configuration: ${{ matrix.configuration }}
      BUILD_VERSION: 10.0.${{ github.run_number }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # Projekty celują w net10.0-windows (LTS), więc SDK musi być 10.0.x.
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    # GeneratePackageOnBuild=true w projektach, więc build od razu tworzy .nupkg.
    - name: Build
      run: dotnet build $env:Solution_Name --configuration $env:Configuration --no-restore -p:Version=$env:BUILD_VERSION
